name: Task 12 bounded journal verification
on:
  push:
    branches: [codex/12-durable-harvest-journal]
    paths: [.github/workflows/task12-journal-once.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'z411392/paper-radar' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          enable-cache: false
      - run: uv sync --locked
      - name: Verify the earlier test-only revision in its own environment
        run: |
          git worktree add --detach "$RUNNER_TEMP/journal-red" ec0e162823a7e191844e5144a273d4a3ede32b6c
          uv sync --locked --offline --project "$RUNNER_TEMP/journal-red"
          uv run --locked --offline python - <<'PY'
          import os,subprocess
          root=os.environ['RUNNER_TEMP']+'/journal-red'
          run=subprocess.run(['uv','run','--locked','--offline','--project',root,'python','-m','pytest',root+'/src/libs/discovery/tests/contract/test_t06_arxiv_discovery.py','-q'],cwd=root)
          assert run.returncode==2,run.returncode
          print('TEST_ONLY_REVISION_COLLECTION_RED=1; THIS_IS_NOT_A_PASS_FOR_EACH_SCENARIO')
          PY
      - name: Format only newly added journal files
        run: |
          uv run --locked --offline python - <<'PY'
          import ast,json,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='3a71a0cba2cddad6c50052286764ea3c5e59f515'
          candidate='454d03150d51a1162a26a8d9769ac9f3d33491d8'
          assert git('rev-parse','HEAD^')==candidate
          paths=git('diff','--name-only',base,candidate).splitlines()
          assert len(paths)==13 and all(p.startswith('src/libs/discovery/') and p.endswith('.py') for p in paths)
          assert not git('diff','--name-only','--diff-filter=MD',base,candidate)
          for name in paths:
              p=Path(name); text=p.read_text(encoding='utf-8'); original=ast.dump(ast.parse(text))
              values={node.value for node in ast.walk(ast.parse(text)) if isinstance(node,ast.Constant) and isinstance(node.value,str) and len(node.value)>90 and '\n' not in node.value}
              for value in sorted(values,key=len,reverse=True):
                  literal=json.dumps(value,ensure_ascii=False)
                  if literal not in text: continue
                  wrapped='(\n'+''.join('    '+json.dumps(value[i:i+70],ensure_ascii=False)+'\n' for i in range(0,len(value),70))+')'
                  text=text.replace(literal,wrapped)
              assert ast.dump(ast.parse(text))==original,name
              p.write_text(text,encoding='utf-8')
          subprocess.run(['uv','run','--locked','--offline','ruff','check','--select','I,F401','--fix',*paths],check=True)
          subprocess.run(['uv','run','--locked','--offline','ruff','format',*paths],check=True)
          print('ONLY_NEW_JOURNAL_FILES_FORMATTED; STRING_VALUES_PRESERVED; IMPORT_CLEANUP_LIMITED_TO_I_F401')
          PY
      - name: Full locked offline gate
        run: make ci-fast
      - name: Export tested objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked --offline python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          repo='z411392/paper-radar'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/codex/12-durable-harvest-journal'
          assert 'OPENROUTER_API_KEY' not in os.environ
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def api(endpoint,body):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as response: return json.load(response)
          allowed=set(git('diff','--name-only','3a71a0cba2cddad6c50052286764ea3c5e59f515','454d03150d51a1162a26a8d9769ac9f3d33491d8').splitlines())
          changed=git('diff','--name-only').splitlines()
          assert set(changed)<=allowed and not git('ls-files','--others','--exclude-standard')
          for name in changed: subprocess.run(['git','add','--',name],check=True)
          temporary='.github/workflows/task12-journal-once.yml'
          subprocess.run(['git','rm','--',temporary],check=True)
          local_tree=git('write-tree'); parent=git('rev-parse','HEAD'); entries=[]
          for name in changed:
              raw=subprocess.check_output(['git','show',local_tree+':'+name])
              sha=api('git/blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})['sha']
              assert sha==git('rev-parse',local_tree+':'+name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          entries.append({'path':temporary,'mode':'100644','type':'blob','sha':None})
          tree=api('git/trees',{'base_tree':git('show','-s','--format=%T',parent),'tree':entries})['sha']
          assert tree==local_tree
          commit=api('git/commits',{'message':'task-12 S1: retain locked-verified durable capture journal\n\nRefs #12. Preserve original migrations, upstream code, specification and test boundaries. Captured is not parsed or checkpointed. Remove temporary runner workflow; no live services, paid calls, main integration or independent ACCEPT.','tree':tree,'parents':[parent]})['sha']
          print('JOURNAL_FINAL_TREE='+tree)
          print('JOURNAL_FINAL_COMMIT='+commit)
          print('No refs or Issues/Project fields changed by this job.')
          PY
