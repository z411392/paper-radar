name: Verify explanation recovery scheduling once

on:
  push:
    branches: [codex/mvp-paper-email-e2e]
    paths:
      - ".github/workflows/verify-explanation-scheduling-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.13.5"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.0
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked
      - name: Verify recovered explanation scheduling
        run: >-
          uv run --locked pytest -q
          src/libs/research_workflow/tests/unit/test_project_source_catalog_unit.py
          -k explanation_job_is_enqueued_before_projection_cursor_advance
