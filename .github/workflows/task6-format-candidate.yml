name: Task 6 bounded formatting repair
on:
  push:
    branches: [codex/6-engineering-foundation]
    paths: [.github/workflows/task6-format-candidate.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.0
          enable-cache: false
      - run: uv sync --locked
      - name: Produce only the exact formatting and wording corrections
        run: |
          uv run --locked --offline python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          p = Path('src/libs/kernel/tests/architecture/test_dependency_direction.py')
          before = ast.dump(ast.parse(p.read_text()))
          subprocess.run(['uv', 'run', '--locked', '--offline', 'ruff', 'format', str(p)], check=True)
          assert before == ast.dump(ast.parse(p.read_text())), 'AST changed'
          p = Path('specs/5-local-workspace/plan.md')
          p.write_text(p.read_text().replace('須', '須').replace('\u987b', '\u9808'))
          PY
      - name: Preserve selected blobs without committing or moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in src/libs/kernel/tests/architecture/test_dependency_direction.py specs/5-local-workspace/plan.md; do
            jq -n --rawfile content "$file" '{encoding:"utf-8",content:$content}' > "$RUNNER_TEMP/repair.json"
            blob=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/repair.json" --jq .sha)
            printf 'REPAIR_BLOB %s %s\n' "$file" "$blob"
          done
          git diff --stat
