name: Task 12 processing receipt and crash boundaries
on:
  push:
    branches: [codex/12-observations-checkpoint]
    paths: [.github/workflows/task12-processing-boundaries-once.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'z411392/paper-radar' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          enable-cache: false
      - run: uv sync --locked
      - name: Verify the bounded input and reproduce the regression
        run: |
          uv run --locked --offline python - <<'PY'
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert set(git('diff','--name-only','ece3ccd2e6c9f5f5bfdc7c9705a7b7ee14373b1e','HEAD').splitlines())=={'.github/repair_processing_boundaries.py','.github/workflows/task12-processing-boundaries-once.yml'}
          run=subprocess.run(['uv','run','--locked','--offline','python','-m','pytest','src/libs/discovery/tests/contract/test_harvest_processing_boundaries.py','-q'])
          assert run.returncode==1,run.returncode
          print('BOUNDARY_BEHAVIOR_RED_CONFIRMED; EXPECTATIONS_NOT_RELAXED')
          PY
      - name: Repair only the bounded receipt and committed-state checks
        run: |
          uv run --locked --offline python .github/repair_processing_boundaries.py
          uv run --locked --offline ruff check --select I,F401 --fix src/libs/discovery/adapters/driven/sqlite_harvest_processing_adapter.py src/libs/discovery/domain/services/harvest_page_rules.py src/libs/discovery/tests/contract/test_harvest_processing_boundaries.py
          uv run --locked --offline ruff format src/libs/discovery/adapters/driven/sqlite_harvest_processing_adapter.py src/libs/discovery/domain/services/harvest_page_rules.py src/libs/discovery/tests/contract/test_harvest_processing_boundaries.py
      - name: Complete locked offline gate
        run: make ci-fast
      - name: Export exact tested objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked --offline python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          repo='z411392/paper-radar'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/codex/12-observations-checkpoint'
          assert 'OPENROUTER_API_KEY' not in os.environ
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def api(endpoint,body):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as response: return json.load(response)
          allowed={'src/libs/discovery/adapters/driven/sqlite_harvest_processing_adapter.py','src/libs/discovery/domain/services/harvest_page_rules.py','src/libs/discovery/tests/contract/test_harvest_processing_boundaries.py'}
          changed=git('diff','--name-only').splitlines()
          assert set(changed)<=allowed and not git('ls-files','--others','--exclude-standard')
          for name in changed: subprocess.run(['git','add','--',name],check=True)
          temporary=['.github/repair_processing_boundaries.py','.github/workflows/task12-processing-boundaries-once.yml']
          subprocess.run(['git','rm','--',*temporary],check=True)
          local_tree=git('write-tree'); parent=git('rev-parse','HEAD'); entries=[]
          for name in changed:
              raw=subprocess.check_output(['git','show',local_tree+':'+name])
              sha=api('git/blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})['sha']
              assert sha==git('rev-parse',local_tree+':'+name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          entries.extend({'path':path,'mode':'100644','type':'blob','sha':None} for path in temporary)
          tree=api('git/trees',{'base_tree':git('show','-s','--format=%T',parent),'tree':entries})['sha']
          assert tree==local_tree
          commit=api('git/commits',{'message':'task-12 S2: validate receipt consistency and crash-safe checkpoint commits\n\nRefs #12. Reject corrupted persisted types and unverifiable processing receipts. Keep earlier test expectations and original migrations. No live source, model secret, paid call, main merge or independent ACCEPT.','tree':tree,'parents':[parent]})['sha']
          print('PROCESSING_FINAL_TREE='+tree)
          print('PROCESSING_FINAL_COMMIT='+commit)
          print('No refs, Issue/Project fields or product services changed by this job.')
          PY
