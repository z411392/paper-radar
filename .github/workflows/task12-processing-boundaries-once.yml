name: Task 12 processing receipt and crash boundaries
on:
  push:
    branches: [codex/12-observations-checkpoint]
    paths: [.github/workflows/task12-processing-boundaries-once.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'z411392/paper-radar' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          enable-cache: false
      - run: uv sync --locked
      - name: Reproduce persisted-state errors before repair
        run: |
          uv run --locked --offline python - <<'PY'
          import subprocess
          run=subprocess.run(['uv','run','--locked','--offline','python','-m','pytest','src/libs/discovery/tests/contract/test_harvest_processing_boundaries.py','-q'])
          assert run.returncode==1,run.returncode
          print('BOUNDARY_BEHAVIOR_RED_CONFIRMED; EXPECTATIONS_NOT_RELAXED')
          PY
      - name: Strengthen receipt and committed-state consistency
        run: |
          uv run --locked --offline python - <<'PY'
          import subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='ece3ccd2e6c9f5f5bfdc7c9705a7b7ee14373b1e'
          adapter=Path('src/libs/discovery/adapters/driven/sqlite_harvest_processing_adapter.py')
          rules=Path('src/libs/discovery/domain/services/harvest_page_rules.py')
          assert git('hash-object',str(adapter))=='533cb003544e618cf6deb4314516b144a7de0f3a'
          assert git('hash-object',str(rules))=='c1f0a4c340f17dbc3056d9f900d3725a4ef1ecf1'
          text=adapter.read_text()
          def replace(old,new):
              global text
              assert text.count(old)==1,old
              text=text.replace(old,new,1)
          replace('        previous = None\n', '        previous = None\n        receipts: list[HarvestPageResult] = []\n')
          replace('            if stored_key == key:\n', '            receipts.append(receipt)\n            if stored_key == key:\n')
          replace('        else:\n            cursor = HarvestPageRules.decode(unit["cursor_json"])', '        else:\n            if state in {"pending", "running", "failed"}:\n                raise HarvestError("invalid_checkpoint_state")\n            if (type(coverage.get("format_version")) is not int\n                    or type(coverage.get("record_count")) is not int\n                    or type(coverage.get("complete")) is not bool):\n                raise HarvestError("invalid_checkpoint_state")\n            cursor = HarvestPageRules.decode(unit["cursor_json"])')
          start=text.index('        records = tuple(\n')
          end=text.index('        return HarvestProcessingSnapshot(\n',start)
          text=text[:start]+'''        observations = connection.execute(
              "SELECT id,native_id FROM source_observations WHERE unit_id=? ORDER BY native_id LIMIT 30001",
              (attempt.unit_id,),
          ).fetchall()
          records = tuple(item["native_id"] for item in observations)
          available_ids = {item["id"] for item in observations}
          if len(records) != next_start or len(set(records)) != len(records):
              raise HarvestError("invalid_checkpoint_observations")
          if version > max(1, next_start):
              raise HarvestError("invalid_checkpoint_state")
          for receipt in receipts:
              if (receipt.checkpoint_version > version or receipt.next_start > next_start
                      or not set(receipt.observation_ids).issubset(available_ids)):
                  raise HarvestError("invalid_processing_receipt")
              if receipt.error_code is None:
                  if (receipt.total_results != total
                          or receipt.next_start != attempt.request.start + len(receipt.observation_ids)):
                      raise HarvestError("invalid_processing_receipt")
              elif receipt.next_start != attempt.request.start:
                  raise HarvestError("invalid_processing_receipt")
          '''.replace('\n          ', '\n        ')+text[end:]
          adapter.write_text(text)
          text=rules.read_text()
          marker='            if PrepareHarvestCapture.time(datetime.fromisoformat(result.processed_at)) != result.processed_at:'
          assert text.count(marker)==1
          extra='''            if result.error_code is None:
                  total = result.total_results
                  if total is None:
                      raise HarvestError("invalid_processing_receipt")
                  if result.state == "verified_empty":
                      if (total != 0 or result.next_start != 0 or result.observation_ids
                              or result.expected_checkpoint_version != 0):
                          raise HarvestError("invalid_processing_receipt")
                  elif (not result.observation_ids or total <= 0
                          or (result.state == "succeeded" and result.next_start != total)
                          or (result.state == "partial" and not 0 < result.next_start < total)):
                      raise HarvestError("invalid_processing_receipt")
              elif ((result.state == "failed" and (
                      result.expected_checkpoint_version != 0 or result.next_start != 0
                      or result.total_results is not None))
                      or (result.state == "partial" and (
                          result.expected_checkpoint_version == 0 or result.next_start == 0))):
                  raise HarvestError("invalid_processing_receipt")
          '''.replace('\n          ', '\n        ')
          text=text.replace(marker,extra+marker,1)
          marker='        return HarvestPageResult(\n'
          assert text.count(marker)==1
          text=text.replace(marker,'        cls.checkpoint(version)\n'+marker,1)
          rules.write_text(text)
          paths=[str(adapter),str(rules),'src/libs/discovery/tests/contract/test_harvest_processing_boundaries.py']
          subprocess.run(['uv','run','--locked','--offline','ruff','check','--select','I,F401','--fix',*paths],check=True)
          subprocess.run(['uv','run','--locked','--offline','ruff','format',*paths],check=True)
          PY
      - name: Complete locked offline gate
        run: make ci-fast
      - name: Export exact tested objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked --offline python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          repo='z411392/paper-radar'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/codex/12-observations-checkpoint'
          assert 'OPENROUTER_API_KEY' not in os.environ
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def api(endpoint,body):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as response: return json.load(response)
          allowed={'src/libs/discovery/adapters/driven/sqlite_harvest_processing_adapter.py','src/libs/discovery/domain/services/harvest_page_rules.py','src/libs/discovery/tests/contract/test_harvest_processing_boundaries.py'}
          changed=git('diff','--name-only').splitlines()
          assert set(changed)<=allowed and not git('ls-files','--others','--exclude-standard')
          for name in changed: subprocess.run(['git','add','--',name],check=True)
          temporary='.github/workflows/task12-processing-boundaries-once.yml'
          subprocess.run(['git','rm','--',temporary],check=True)
          local_tree=git('write-tree'); parent=git('rev-parse','HEAD'); entries=[]
          for name in changed:
              raw=subprocess.check_output(['git','show',local_tree+':'+name])
              sha=api('git/blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})['sha']
              assert sha==git('rev-parse',local_tree+':'+name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          entries.append({'path':temporary,'mode':'100644','type':'blob','sha':None})
          tree=api('git/trees',{'base_tree':git('show','-s','--format=%T',parent),'tree':entries})['sha']
          assert tree==local_tree
          commit=api('git/commits',{'message':'task-12 S2: validate receipt consistency and crash-safe checkpoint commits\n\nRefs #12. Reject corrupted persisted types and unverifiable processing receipts. Keep earlier test expectations and original migrations. No live source, model secret, paid call, main merge or independent ACCEPT.','tree':tree,'parents':[parent]})['sha']
          print('PROCESSING_FINAL_TREE='+tree)
          print('PROCESSING_FINAL_COMMIT='+commit)
          print('No refs, Issue/Project fields or product services changed by this job.')
          PY
