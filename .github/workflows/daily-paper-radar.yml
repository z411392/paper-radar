name: Daily Paper Radar

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Allow durable workspace bootstrap when no prior artifact exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-paper-radar
  cancel-in-progress: false

jobs:
  daily-worker:
    name: daily-worker (${{ matrix.domain_label }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - domain_id: deep_learning
            domain_label: 深度學習
            scope: 關注深度學習的新論文，包含神經網路、表示學習、生成模型與相關方法。
          - domain_id: machine_learning
            domain_label: 機器學習
            scope: 關注機器學習的新論文，包含學習演算法、模型評估、泛化與相關方法。
          - domain_id: statistics
            domain_label: 統計
            scope: 關注統計學的新論文，包含統計推論、方法論、應用統計與統計機器學習。
          - domain_id: badminton
            domain_label: 羽球
            scope: 關注羽球相關的新研究，包含運動表現、訓練、傷害、復健、生理與運動醫學。
          - domain_id: male_reproductive_urology
            domain_label: 男性生殖學／泌尿科醫學
            scope: 關注男性生殖學、男性不孕、男科學與泌尿科醫學的新研究。
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UV_PYTHON: "3.13.5"
      PAPER_RADAR_OPENROUTER_API_KEY: ${{ secrets.PAPER_RADAR_OPENROUTER_API_KEY }}
      PAPER_RADAR_SMTP_HOST: ${{ secrets.PAPER_RADAR_SMTP_HOST }}
      PAPER_RADAR_SMTP_PORT: ${{ secrets.PAPER_RADAR_SMTP_PORT }}
      PAPER_RADAR_SMTP_SECURITY: ${{ secrets.PAPER_RADAR_SMTP_SECURITY }}
      PAPER_RADAR_SMTP_SENDER: ${{ secrets.PAPER_RADAR_SMTP_SENDER }}
      PAPER_RADAR_SMTP_USERNAME: ${{ secrets.PAPER_RADAR_SMTP_USERNAME }}
      PAPER_RADAR_SMTP_PASSWORD: ${{ secrets.PAPER_RADAR_SMTP_PASSWORD }}
      PAPER_RADAR_SMTP_RECIPIENT: ${{ secrets.PAPER_RADAR_SMTP_RECIPIENT }}
      PAPER_RADAR_DOMAIN_ID: ${{ matrix.domain_id }}
      PAPER_RADAR_DOMAIN_LABEL: ${{ matrix.domain_label }}
      PAPER_RADAR_DOMAIN_SCOPE: ${{ matrix.scope }}
      PAPER_RADAR_ARTIFACT_NAME: paper-radar-daily-${{ matrix.domain_id }}

    steps:
      - name: Define runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'PAPER_RADAR_WORKSPACE_DIR=%s\n' "$RUNNER_TEMP/paper-radar-data" >>"$GITHUB_ENV"
          printf 'PAPER_RADAR_ENV_FILE=%s\n' "$RUNNER_TEMP/paper-radar-worker.env" >>"$GITHUB_ENV"

      - name: Check required repository secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            PAPER_RADAR_OPENROUTER_API_KEY \
            PAPER_RADAR_SMTP_HOST \
            PAPER_RADAR_SMTP_PORT \
            PAPER_RADAR_SMTP_SECURITY \
            PAPER_RADAR_SMTP_SENDER \
            PAPER_RADAR_SMTP_USERNAME \
            PAPER_RADAR_SMTP_PASSWORD \
            PAPER_RADAR_SMTP_RECIPIENT
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.0
          enable-cache: false

      - name: Install the locked runtime
        run: uv sync --locked

      - name: Find latest durable workspace artifact
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        run: |
          set -euo pipefail
          artifacts="$(
            gh api               "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PAPER_RADAR_ARTIFACT_NAME}&per_page=100"
          )"
          prior_run_id="$(
            jq -r '
              [.artifacts[] | select(.expired == false)]
              | sort_by(.created_at)
              | last
              | .workflow_run.id // empty
            ' <<<"$artifacts"
          )"
          if [[ -n "$prior_run_id" ]]; then
            echo "found=true" >>"$GITHUB_OUTPUT"
            echo "run_id=$prior_run_id" >>"$GITHUB_OUTPUT"
            echo "bootstrap=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          artifact_count="$(jq -r '.total_count // 0' <<<"$artifacts")"
          if [[ "$artifact_count" == "0" || "${BOOTSTRAP_REQUESTED:-false}" == "true" ]]; then
            echo "found=false" >>"$GITHUB_OUTPUT"
            echo "bootstrap=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Durable Paper Radar workspace artifact is missing for $PAPER_RADAR_DOMAIN_ID."
          echo "::error::Refusing automatic re-bootstrap because this domain had durable state before."
          echo "::error::After investigating state loss, manually dispatch with bootstrap=true if reset is intentional."
          exit 1

      - name: Restore durable workspace
        if: steps.state.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PAPER_RADAR_ARTIFACT_NAME }}
          path: ${{ env.PAPER_RADAR_WORKSPACE_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.state.outputs.run_id }}

      - name: Build private worker env
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'PAPER_RADAR_WORKSPACE=%s\n' "$PAPER_RADAR_WORKSPACE_DIR"
            printf 'PAPER_RADAR_ALLOW_LIVE_SOURCE=true\n'
            printf 'PAPER_RADAR_ALLOW_LIVE_MODEL=true\n'
            printf 'PAPER_RADAR_ALLOW_LIVE_MAIL=true\n'
            printf 'PAPER_RADAR_PROFILE_DOMAINS=%s\n' "$PAPER_RADAR_DOMAIN_ID"
            printf 'PAPER_RADAR_PROFILE_SCOPE=%s\n' "$PAPER_RADAR_DOMAIN_SCOPE"
            printf 'PAPER_RADAR_OPENROUTER_API_KEY=%s\n' "$PAPER_RADAR_OPENROUTER_API_KEY"
            printf 'PAPER_RADAR_MODEL_MONTHLY_BUDGET_USD=2.00\n'
            printf 'PAPER_RADAR_RECIPIENT_EMAIL=%s\n' "$PAPER_RADAR_SMTP_RECIPIENT"
            printf 'PAPER_RADAR_SMTP_HOST=%s\n' "$PAPER_RADAR_SMTP_HOST"
            printf 'PAPER_RADAR_SMTP_PORT=%s\n' "$PAPER_RADAR_SMTP_PORT"
            printf 'PAPER_RADAR_SMTP_SECURITY=%s\n' "$PAPER_RADAR_SMTP_SECURITY"
            printf 'PAPER_RADAR_SMTP_SENDER=%s\n' "$PAPER_RADAR_SMTP_SENDER"
            printf 'PAPER_RADAR_SMTP_USERNAME=%s\n' "$PAPER_RADAR_SMTP_USERNAME"
            printf 'PAPER_RADAR_SMTP_PASSWORD=%s\n' "$PAPER_RADAR_SMTP_PASSWORD"
            printf 'PAPER_RADAR_DIGEST_TIMEZONE=Asia/Taipei\n'
            printf 'PAPER_RADAR_DIGEST_LOCAL_TIME=08:00\n'
            printf 'PAPER_RADAR_DIGEST_MAX_ITEMS=100\n'
            printf 'PAPER_RADAR_POLL_SECONDS=10\n'
            printf 'PAPER_RADAR_MAX_NEW_JOBS=50\n'
            printf 'PAPER_RADAR_MAX_JOBS=5\n'
            printf 'PAPER_RADAR_LEASE_SECONDS=300\n'
          } >"$PAPER_RADAR_ENV_FILE"
          chmod 600 "$PAPER_RADAR_ENV_FILE"

      - name: Bootstrap durable workspace once
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.state.outputs.bootstrap }}" == "true" ]]; then
            uv run --locked python -m apps.cli init               --env-file "$PAPER_RADAR_ENV_FILE"
            uv run --locked python -m apps.cli effects enable               --env-file "$PAPER_RADAR_ENV_FILE"
          fi
          test -d "$PAPER_RADAR_WORKSPACE_DIR"
          echo "ready=true" >>"$GITHUB_OUTPUT"

      - name: Drain today's worker queue
        shell: bash
        run: |
          set -euo pipefail
          drained=false
          for cycle in $(seq 1 200)
          do
            echo "Paper Radar worker cycle $cycle"
            output="$(
              uv run --locked python -m apps.cli run-worker \
                --env-file "$PAPER_RADAR_ENV_FILE" \
                --once
            )"
            printf '%s\n' "$output"
            processed="$(jq -r '.processed_jobs' <<<"$output")"
            new_jobs="$(jq -r '.scheduler.new_jobs' <<<"$output")"
            if [[ "$processed" == "0" && "$new_jobs" == "0" ]]; then
              drained=true
              break
            fi
          done
          if [[ "$drained" != "true" ]]; then
            echo "::error::Daily worker queue did not drain within 200 cycles."
            exit 1
          fi

      - name: Show durable delivery status
        if: always() && steps.workspace.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status_json="$(
            uv run --locked python -m apps.cli digest status \
              --env-file "$PAPER_RADAR_ENV_FILE" \
              --limit 10
          )"
          printf '%s\n' "$status_json"

          {
            echo "## Paper Radar delivery status — $PAPER_RADAR_DOMAIN_LABEL"
            echo
            if [[ "$(jq '.deliveries | length' <<<"$status_json")" == "0" ]]; then
              echo "No delivery history yet."
            else
              echo "### Digests"
              echo
              echo "| Period | Delivery | Attempts | Latest error |"
              echo "| --- | --- | ---: | --- |"
              jq -r '
                .deliveries[]
                | "| \(.period_key) | \(.delivery_state) | \(.attempt_count) | \((.latest_error_code // "-") | gsub("\\|"; "\\\\|")) |"
              ' <<<"$status_json"
              echo
              echo "### Papers / notices"
              echo
              echo "| Period | Title | Event | Send status | Notification |"
              echo "| --- | --- | --- | --- | --- |"
              jq -r '
                .deliveries[] as $delivery
                | $delivery.items[]
                | "| \($delivery.period_key) | \(.title | gsub("[\\r\\n]"; " ") | gsub("\\|"; "\\\\|")) | \(.event_kind) | \(.send_status) | \(.notification_state) |"
              ' <<<"$status_json"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Persist durable workspace
        if: always() && steps.workspace.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PAPER_RADAR_ARTIFACT_NAME }}
          path: ${{ env.PAPER_RADAR_WORKSPACE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
