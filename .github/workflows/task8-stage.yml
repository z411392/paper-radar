name: Task 8 bounded candidate verification
on:
  push:
    branches: [codex/8-watch-profile-revisions]
    paths: [.github/task8_stage.py, .github/workflows/task8-stage.yml]
permissions:
  contents: write
concurrency:
  group: task8-bounded-materialization
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.0
          enable-cache: false
      - name: Install existing locked development dependencies
        run: uv sync --locked
      - name: Materialize only checksum-verified author files
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --offline python .github/task8_stage.py prepare
      - name: Wrap the unchanged child-process source string
        run: |
          uv run --locked --offline python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('src/libs/watch_profiles/tests/contract/test_t03_local_workspace.py')
          source = path.read_text(encoding='utf-8')
          before = ast.dump(ast.parse(source))
          source = source.replace(
              'from libs.watch_profiles.adapters.driven.sqlite_watch_profile_store_adapter import '
              'SqliteWatchProfileStoreAdapter\n',
              'from libs.watch_profiles.adapters.driven.sqlite_watch_profile_store_adapter '
              '\\\nimport SqliteWatchProfileStoreAdapter\n',
          )
          assert ast.dump(ast.parse(source)) == before
          path.write_text(source, encoding='utf-8')
          PY
      - name: Run complete existing and new offline checks
        run: make ci-fast
      - name: Repeat concurrency and show actual SQLite runtime
        run: |
          uv run --locked --offline python -c 'import sqlite3; print("SQLITE_RUNTIME=" + sqlite3.sqlite_version)'
          for round in 1 2 3 4 5; do
            uv run --locked --offline python -m pytest src/libs/watch_profiles/tests/contract/test_t03_local_workspace.py -k concurrent -q
          done
      - name: Export verified Subtask commits without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --offline python .github/task8_stage.py export
