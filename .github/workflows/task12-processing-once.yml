name: Task 12 persisted-page processing verification
on:
  push:
    branches: [codex/12-observations-checkpoint]
    paths: [.github/workflows/task12-processing-once.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'z411392/paper-radar' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          enable-cache: false
      - run: uv sync --locked
      - name: Verify the test-only revision without implementation
        run: |
          git worktree add --detach "$RUNNER_TEMP/processing-red" 192a21ec232f984e97370390ee668750b214a5f4
          uv sync --locked --offline --project "$RUNNER_TEMP/processing-red"
          uv run --locked --offline python - <<'PY'
          import os,subprocess
          root=os.environ['RUNNER_TEMP']+'/processing-red'
          env=dict(os.environ); env.pop('VIRTUAL_ENV',None)
          run=subprocess.run(['uv','run','--locked','--offline','--project',root,'python','-m','pytest','src/libs/discovery/tests/contract/test_harvest_page_processing.py','-q'],cwd=root,env=env)
          assert run.returncode==2,run.returncode
          print('TEST_ONLY_COLLECTION_RED_CONFIRMED; NOT_INDIVIDUAL_BEHAVIOR_FAILURES')
          PY
      - name: Apply the bounded S1 envelope compatibility and format only this slice
        run: |
          uv run --locked --offline python - <<'PY'
          import ast,json,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='0d771e0839f4b7d707eceb0f4c9716cf9e8e13ac'
          candidate='3e35451fd26d9b2e0dc2cc7782160dfc6bddc341'
          assert git('diff','--name-only',candidate,'HEAD')=='.github/workflows/task12-processing-once.yml'
          paths=git('diff','--name-only',base,candidate).splitlines()
          assert len(paths)==8 and all(p.startswith('src/libs/discovery/') and p.endswith('.py') for p in paths)
          assert not git('diff','--name-only','--diff-filter=MD',base,candidate)
          compatibility='src/libs/discovery/adapters/driven/sqlite_harvest_store_adapter.py'
          assert git('hash-object',compatibility)=='780a0e0b247c196c88590163a2554651482dcd05'
          p=Path(compatibility); text=p.read_text()
          old='set(data) != {"format_version", "request", "capture"}'
          new='set(data) not in ({"format_version", "request", "capture"}, {"format_version", "request", "capture", "processing"})\n                or ("processing" in data and not isinstance(data["processing"], dict))'
          assert text.count(old)==1
          p.write_text(text.replace(old,new,1))
          paths.append(compatibility)
          for name in paths:
              p=Path(name); text=p.read_text(encoding='utf-8'); original=ast.dump(ast.parse(text))
              values={node.value for node in ast.walk(ast.parse(text)) if isinstance(node,ast.Constant) and isinstance(node.value,str) and len(node.value)>90 and '\n' not in node.value}
              for value in sorted(values,key=len,reverse=True):
                  literal=json.dumps(value,ensure_ascii=False)
                  if literal not in text: continue
                  wrapped='(\n'+''.join('    '+json.dumps(value[i:i+70],ensure_ascii=False)+'\n' for i in range(0,len(value),70))+')'
                  text=text.replace(literal,wrapped)
              assert ast.dump(ast.parse(text))==original,name
              p.write_text(text,encoding='utf-8')
          subprocess.run(['uv','run','--locked','--offline','ruff','check','--select','I,F401','--fix',*paths],check=True)
          subprocess.run(['uv','run','--locked','--offline','ruff','format',*paths],check=True)
          print('SCOPED_8_NEW_FILES_AND_S1_OPTIONAL_ENVELOPE; ORIGINAL_TEST_EXPECTATIONS_PRESERVED')
          PY
      - name: Verify processing behavior
        run: uv run --locked --offline python -m pytest src/libs/discovery/tests/contract/test_harvest_page_processing.py -q
      - name: Complete locked offline gate
        run: make ci-fast
      - name: Export tested objects without moving branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked --offline python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          repo='z411392/paper-radar'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/codex/12-observations-checkpoint'
          assert 'OPENROUTER_API_KEY' not in os.environ
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def api(endpoint,body):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as response: return json.load(response)
          allowed=set(git('diff','--name-only','0d771e0839f4b7d707eceb0f4c9716cf9e8e13ac','3e35451fd26d9b2e0dc2cc7782160dfc6bddc341').splitlines())
          allowed.add('src/libs/discovery/adapters/driven/sqlite_harvest_store_adapter.py')
          changed=git('diff','--name-only').splitlines()
          assert set(changed)<=allowed and not git('ls-files','--others','--exclude-standard')
          for name in changed: subprocess.run(['git','add','--',name],check=True)
          temporary='.github/workflows/task12-processing-once.yml'
          subprocess.run(['git','rm','--',temporary],check=True)
          local_tree=git('write-tree'); parent=git('rev-parse','HEAD'); entries=[]
          for name in changed:
              raw=subprocess.check_output(['git','show',local_tree+':'+name])
              sha=api('git/blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})['sha']
              assert sha==git('rev-parse',local_tree+':'+name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          entries.append({'path':temporary,'mode':'100644','type':'blob','sha':None})
          tree=api('git/trees',{'base_tree':git('show','-s','--format=%T',parent),'tree':entries})['sha']
          assert tree==local_tree
          commit=api('git/commits',{'message':'task-12 S2: retain verified observations and checkpoint candidate\n\nRefs #12. Preserve capture compatibility and original SQL, lock, specifications, and tests. One transaction for observations, progress and receipts. No live service, paid call, main integration or independent ACCEPT.','tree':tree,'parents':[parent]})['sha']
          print('PROCESSING_FINAL_TREE='+tree)
          print('PROCESSING_FINAL_COMMIT='+commit)
          print('No refs, Issue/Project fields or product services changed by this job.')
          PY
