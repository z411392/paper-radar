name: Task 60 v3 governance adoption
on:
  push:
    branches: [codex/60-methodology-v3]
    paths: [.github/workflows/task60-v3-once.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'z411392/paper-radar' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          enable-cache: false
      - run: uv sync --locked
      - name: Record the old-form failures before changing guidance
        run: |
          uv run --locked --offline python - <<'PY'
          import subprocess
          result=subprocess.run(['uv','run','--locked','--offline','python','-m','pytest','src/libs/kernel/tests/governance/test_issue_form_guidance.py','-q'])
          assert result.returncode==1, result.returncode
          print('OLD_GUIDANCE_RED_CONFIRMED; NO_TEST_EXPECTATIONS_CHANGED')
          PY
      - name: Apply the bounded v3 clarification
        run: |
          uv run --locked --offline python .github/adopt_methodology_v3.py
          uv run --locked --offline ruff format src/libs/kernel/tests/governance/test_issue_form_guidance.py
      - run: make ci-fast
      - name: Export verified candidate without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked --offline python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          repo='z411392/paper-radar'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/codex/60-methodology-v3'
          assert 'OPENROUTER_API_KEY' not in os.environ
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def api(endpoint,body):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as response: return json.load(response)
          allowed={'.claude/rules/80-documentation.md','.claude/rules/16-github-human-readable-records.md','specs/README.md','.authority/manifests/git-baseline.json','src/libs/kernel/tests/governance/test_issue_form_guidance.py'}
          allowed.update('.github/ISSUE_TEMPLATE/'+kind+'.yml' for kind in ['epic','story','task','spike','bug'])
          changed=git('diff','--name-only').splitlines()
          assert set(changed)<=allowed and not git('ls-files','--others','--exclude-standard')
          for name in changed: subprocess.run(['git','add','--',name],check=True)
          temps=['.github/adopt_methodology_v3.py','.github/workflows/task60-v3-once.yml']
          subprocess.run(['git','rm','--',*temps],check=True)
          local_tree=git('write-tree'); parent=git('rev-parse','HEAD'); entries=[]
          for name in changed:
              raw=subprocess.check_output(['git','show',local_tree+':'+name])
              sha=api('git/blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})['sha']
              assert sha==git('rev-parse',local_tree+':'+name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          entries += [{'path':name,'mode':'100644','type':'blob','sha':None} for name in temps]
          tree=api('git/trees',{'base_tree':git('show','-s','--format=%T',parent),'tree':entries})['sha']
          assert tree==local_tree
          commit=api('git/commits',{'message':'task-60 S4: retain verified v3 rules and purpose-specific issue forms\n\nRefs #60. Git-retained is valid long term. Keep original specifications, machine IDs and labels, and independent review. No Issue-authority cutover, paid calls, main merge or fabricated acceptance.','tree':tree,'parents':[parent]})['sha']
          print('V3_FINAL_TREE='+tree)
          print('V3_FINAL_COMMIT='+commit)
          print('No refs, Issues, Projects or external product services changed by this job.')
          PY
