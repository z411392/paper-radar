name: Task 6 explicit dependency lock resolution
on:
  push:
    branches: [codex/6-engineering-foundation]
    paths: [.github/workflows/task6-resolve-lock.yml]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.0
          enable-cache: false
      - name: Resolve the explicitly changed development dependencies
        run: uv lock --python 3.13.5
      - name: Preserve the exact lock without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum pyproject.toml uv.lock
          jq -n --rawfile content uv.lock '{encoding:"utf-8", content:$content}' > "$RUNNER_TEMP/lock-blob.json"
          blob=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/lock-blob.json" --jq .sha)
          printf 'TASK6_LOCK_BLOB=%s\n' "$blob"
