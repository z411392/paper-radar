name: Live arXiv smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mvp-paper-email-e2e
    paths:
      - .github/workflows/live-arxiv-smoke.yml

permissions:
  contents: read

concurrency:
  group: live-arxiv-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arxiv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.13.5"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.0
          enable-cache: false

      - name: Install the locked development environment
        run: uv sync --locked

      - name: Verify bounded local arXiv deferral
        run: >-
          uv run --locked pytest -q
          src/libs/research_workflow/tests/contract/test_resumable_harvest.py
          -k 'local_provider_defer_waits_without_durable_failed_capture or
          long_provider_defer_remains_durable_retry_not_local_sleep'

      - name: Run bounded public arXiv freshness smoke
        run: make mvp-live-arxiv
