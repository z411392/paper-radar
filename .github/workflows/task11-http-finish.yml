name: Task 11 bounded HTTP and throttle verification
on:
  push:
    branches: [codex/11-arxiv-http-throttle]
    paths: [.github/workflows/task11-http-finish.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'z411392/paper-radar' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          enable-cache: false
      - run: uv sync --locked
      - name: Verify fixed scope and format only new source files
        run: |
          uv run --locked --offline python - <<'PY'
          import ast,subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='b3f52b1ba5f98a3a991207da3bc8dea0dab58f42'
          candidate='9ea351180c3a0c3079dfd0e32324800989b30160'
          assert git('rev-parse','HEAD^')==candidate
          assert git('diff','--name-only',candidate,'HEAD')=='.github/workflows/task11-http-finish.yml'
          paths=git('diff','--name-only',base,candidate).splitlines()
          assert len(paths)==15 and all(p.startswith('src/libs/discovery/') and p.endswith('.py') for p in paths)
          assert not git('diff','--name-only','--diff-filter=MD',base,candidate)
          before={name:ast.dump(ast.parse(Path(name).read_bytes())) for name in paths}
          subprocess.run(['uv','run','--locked','--offline','ruff','format',*paths],check=True)
          for name,value in before.items(): assert ast.dump(ast.parse(Path(name).read_bytes()))==value
          print('ONLY_15_NEW_DISCOVERY_FILES; AST_PRESERVED; NO_UPSTREAM_SOURCE_OR_RULE_CHANGE')
          PY
      - name: Complete locked offline gate
        run: make ci-fast
      - name: Export exact tested objects without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked --offline python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          repo='z411392/paper-radar'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/codex/11-arxiv-http-throttle'
          assert 'OPENROUTER_API_KEY' not in os.environ
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def api(endpoint,body):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as response: return json.load(response)
          allowed=set(git('diff','--name-only','b3f52b1ba5f98a3a991207da3bc8dea0dab58f42','9ea351180c3a0c3079dfd0e32324800989b30160').splitlines())
          changed=git('diff','--name-only').splitlines()
          assert set(changed)<=allowed and not git('ls-files','--others','--exclude-standard')
          for name in changed: subprocess.run(['git','add','--',name],check=True)
          temporary='.github/workflows/task11-http-finish.yml'
          subprocess.run(['git','rm','--',temporary],check=True)
          local_tree=git('write-tree'); parent=git('rev-parse','HEAD'); entries=[]
          for name in changed:
              raw=subprocess.check_output(['git','show',local_tree+':'+name])
              sha=api('git/blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})['sha']
              assert sha==git('rev-parse',local_tree+':'+name)
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          entries.append({'path':temporary,'mode':'100644','type':'blob','sha':None})
          tree=api('git/trees',{'base_tree':git('show','-s','--format=%T',parent),'tree':entries})['sha']
          assert tree==local_tree
          commit=api('git/commits',{'message':'task-11 S2: retain locked verified HTTP and local throttle candidate\n\nRefs #11. Full locked validation, source AST preserved, upstream code and governance unchanged. Remove temporary verification workflow. No live source, LLM, main integration or independent ACCEPT.','tree':tree,'parents':[parent]})['sha']
          print('HTTP_FINAL_TREE='+tree)
          print('HTTP_FINAL_COMMIT='+commit)
          print('No refs, Issue/Project fields, or live product services changed.')
          PY
