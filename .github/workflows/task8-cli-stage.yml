name: Task 8 CLI bounded integration
on:
  push:
    branches: [codex/8-watch-profile-cli]
    paths: [.github/task8_cli_stage.py, .github/workflows/task8-cli-stage.yml]
permissions:
  contents: write
concurrency:
  group: task8-cli-bounded-integration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: 0.10.0
          enable-cache: false
      - name: Install existing locked dependencies
        run: uv sync --locked
      - name: Apply reviewed assembly and test-label corrections
        run: |
          uv run --locked --offline python - <<'PY'
          from pathlib import Path
          path = Path('.github/task8_cli_stage.py')
          source = path.read_text(encoding='utf-8')
          old = 'assert ours.startswith(base) and theirs.startswith(base), name'
          assert source.count(old) == 1
          source = source.replace(old, 'assert theirs.startswith(base), name')
          old = '    return payload\n'
          assert source.count(old) == 1
          patch = '''    test_path = "src/apps/cli/tests/acceptance/test_watch_profile_cli.py"
              original = payload["files"][test_path]
              old_label = "])\\ndef test_bad_file_does_not_modify_database"
              new_label = "], ids=[\"malformed-json\", \"duplicate-keys\", \"invalid-utf8\", \"oversized-file\"])\\ndef test_bad_file_does_not_modify_database"
              assert original.count(old_label) == 1
              payload["files"][test_path] = original.replace(old_label, new_label)
              return payload
          '''
          # Generate the source using repr, so quotes inside the replacement stay exact.
          patch = (
              '    test_path = "src/apps/cli/tests/acceptance/test_watch_profile_cli.py"\n'
              '    original = payload["files"][test_path]\n'
              '    old_label = ' + repr('])\ndef test_bad_file_does_not_modify_database') + '\n'
              '    new_label = ' + repr('], ids=["malformed-json", "duplicate-keys", "invalid-utf8", "oversized-file"])\ndef test_bad_file_does_not_modify_database') + '\n'
              '    assert original.count(old_label) == 1\n'
              '    payload["files"][test_path] = original.replace(old_label, new_label)\n'
              '    return payload\n'
          )
          source = source.replace(old, patch)
          old = '["git", "rm", "--", name]'
          assert source.count(old) == 1
          source = source.replace(old, '["git", "rm", "-f", "--", name]')
          compile(source, str(path), 'exec')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Assemble exact parents and retain real CLI RED
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --offline python .github/task8_cli_stage.py prepare
      - name: Verify all old and new tests without live side effects
        run: make ci-fast
      - name: Record exact SQLite build without accepting it for production
        run: uv run --locked --offline python -c 'import sqlite3; c=sqlite3.connect(":memory:"); print("SQLITE_VERSION="+sqlite3.sqlite_version); print("SQLITE_SOURCE_ID="+c.execute("select sqlite_source_id()").fetchone()[0]); c.close()'
      - name: Export tested candidate objects, never move refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --offline python .github/task8_cli_stage.py export
