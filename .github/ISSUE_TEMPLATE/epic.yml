name: Epic
description: 繁體中文導讀與可追溯正式契約
labels: ["type:epic"]
body:
  - type: textarea
    id: human
    attributes:
      label: 白話說明
      description: 問題、原因、成果與不代表什麼。
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Formal Contract
      description: Authority、parent、scope、AC 連結、inputs/outputs、依賴、writer、writable/frozen、GWT 與停止點；Task Subtask 留在本卡。
    validations:
      required: true
